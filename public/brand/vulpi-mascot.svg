<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Vulpi the fox mascot wearing a driver's cap and holding a car key" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Vulpi the fox mascot</title>
  <defs>
    <clipPath id="tailClip">
      <ellipse cx="312" cy="288" rx="36" ry="74" transform="rotate(28 312 288)"/>
    </clipPath>
  </defs>

  <!-- background -->
  <circle cx="200" cy="200" r="190" fill="#E6F4F1"/>

  <!-- tail with white tip -->
  <g clip-path="url(#tailClip)">
    <ellipse cx="312" cy="288" rx="36" ry="74" transform="rotate(28 312 288)" fill="#E8772E"/>
    <rect x="270" y="205" width="90" height="42" transform="rotate(28 312 288)" fill="#FFF4E6"/>
  </g>

  <!-- body -->
  <ellipse cx="200" cy="270" rx="78" ry="92" fill="#E8772E"/>
  <ellipse cx="200" cy="292" rx="48" ry="68" fill="#FFF4E6"/>

  <!-- feet -->
  <ellipse cx="168" cy="358" rx="26" ry="11" fill="#3B2216"/>
  <ellipse cx="232" cy="358" rx="26" ry="11" fill="#3B2216"/>

  <!-- left arm (down) -->
  <path d="M135 222 Q98 272 118 316 Q148 306 154 262 Z" fill="#E8772E"/>
  <circle cx="126" cy="314" r="13" fill="#3B2216"/>

  <!-- ears -->
  <path d="M128 124 L110 44 L172 92 Z" fill="#E8772E"/>
  <path d="M272 124 L290 44 L228 92 Z" fill="#E8772E"/>
  <path d="M131 108 L122 68 L158 94 Z" fill="#3B2216"/>
  <path d="M269 108 L278 68 L242 94 Z" fill="#3B2216"/>

  <!-- head -->
  <path d="M118 140 Q122 202 200 224 Q278 202 282 140 Q282 90 200 88 Q118 90 118 140 Z" fill="#E8772E"/>
  <!-- white muzzle and cheeks -->
  <path d="M200 224 Q130 206 124 160 Q160 178 200 174 Q240 178 276 160 Q270 206 200 224 Z" fill="#FFF4E6"/>
  <!-- blush -->
  <ellipse cx="142" cy="188" rx="12" ry="7" fill="#F4A58A" opacity="0.55"/>
  <ellipse cx="258" cy="188" rx="12" ry="7" fill="#F4A58A" opacity="0.55"/>

  <!-- driver's cap between the ears -->
  <path d="M156 98 C156 54 244 54 244 98 Z" fill="#1AA3A3"/>
  <path d="M146 100 Q200 118 254 100 Q252 92 242 95 L158 95 Q148 92 146 100 Z" fill="#0F7F82"/>
  <circle cx="200" cy="79" r="11" fill="#F5B82E"/>
  <circle cx="200" cy="79" r="6" fill="none" stroke="#0F7F82" stroke-width="2.2"/>
  <path d="M200 73 V79 M194.5 82 L200 79 L205.5 82" stroke="#0F7F82" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- brows -->
  <path d="M148 132 Q166 124 184 132" fill="none" stroke="#3B2216" stroke-width="5" stroke-linecap="round"/>
  <path d="M216 130 Q236 117 254 128" fill="none" stroke="#3B2216" stroke-width="5" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="166" cy="154" rx="11" ry="14" fill="#2B1B0E"/>
  <ellipse cx="234" cy="154" rx="11" ry="14" fill="#2B1B0E"/>
  <circle cx="170" cy="149" r="4" fill="#FFFFFF"/>
  <circle cx="238" cy="149" r="4" fill="#FFFFFF"/>

  <!-- nose and smile -->
  <ellipse cx="200" cy="198" rx="12" ry="8.5" fill="#2B1B0E"/>
  <ellipse cx="196" cy="195" rx="3.5" ry="2" fill="#FFFFFF" opacity="0.7"/>
  <path d="M200 207 V213 M200 213 Q188 221 176 213 M200 213 Q212 221 224 213" fill="none" stroke="#2B1B0E" stroke-width="3.5" stroke-linecap="round"/>

  <!-- car key -->
  <g fill="none" stroke="#F5B82E" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="342" cy="126" r="16" stroke-width="7"/>
    <path d="M338 142 L328 176" stroke-width="8"/>
    <path d="M332 164 l-9 -4 M336 152 l-9 -4" stroke-width="5"/>
  </g>

  <!-- right arm (raised, holding the key) -->
  <path d="M264 224 Q316 216 326 178 Q296 172 262 194 Z" fill="#E8772E"/>
  <circle cx="324" cy="172" r="13" fill="#3B2216"/>
</svg>
